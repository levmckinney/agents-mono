[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-viewer"
version = "0.1.0"
description = "Web app for visualising per-token projections onto the Assistant Axis"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.23.0",
    "assistant-axis @ git+https://github.com/safety-research/assistant-axis.git",
]

# NOTE: For AWQ-quantised models you also need autoawq.  It is not listed here
# because it requires a matching CUDA toolkit at install time.  Install it
# manually in your environment:
#   pip install autoawq

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
